# Full dev stack for Hermes-Chat — run everything in Docker (hot reload):
#   cd hermes
#   git submodule update --init            # fetch the Hermes agent (vendor/hermes-agent)
#   cp .env.example .env                   # set OPENROUTER_API_KEY + HERMES_API_KEY
#   docker compose up --build              # first build of the Hermes image is large
# Then open http://localhost:5273.
#
# Services: postgres, the real Hermes agent (vendor/hermes-agent, exposing its
# OpenAI-compatible api_server on :8642), the BFF (auto-applies Prisma migrations
# + hot reload), and the Vite client (hot reload).

name: hermes-chat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes_chat
    ports:
      - '5432:5432'
    volumes:
      - hermes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hermes -d hermes_chat']
      interval: 5s
      timeout: 5s
      retries: 10

  # Real Hermes agent (Nous Research), built from the fork submodule at
  # vendor/hermes-agent. Its `api_server` platform (enabled by API_SERVER_KEY)
  # serves the OpenAI-compatible + Sessions API the BFF speaks natively on :8642.
  # The agent calls OpenRouter for the LLM — no GPU. Tools execute INSIDE this
  # container (the isolation boundary). Requires OPENROUTER_API_KEY + HERMES_API_KEY.
  hermes-agent:
    build:
      context: ./vendor/hermes-agent
    # main-wrapper drops to the hermes user and activates the venv for us, so we
    # can set the model (optional) then run the gateway in the foreground.
    command:
      - sh
      - -lc
      - 'if [ -n "$$HERMES_MODEL" ]; then hermes config set model.default "$$HERMES_MODEL" >/dev/null 2>&1 || true; fi; exec hermes gateway run'
    environment:
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: '0.0.0.0'
      API_SERVER_PORT: '8642'
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in hermes/.env}
      API_SERVER_MODEL_NAME: hermes-agent
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in hermes/.env}
      # Optional: an OpenRouter model id (e.g. nousresearch/hermes-4-405b).
      # Empty → use the seeded default (anthropic/claude-opus-4.6 via OpenRouter).
      HERMES_MODEL: ${HERMES_MODEL:-}
    volumes:
      - hermes-agent-data:/opt/data
    ports:
      - '8642:8642'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8642/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  server:
    image: hermes-chat-dev:local
    build:
      context: .
      target: dev
    command: sh -lc "npm run db:generate -w @hermes/server && npm run db:deploy -w @hermes/server && npm run dev -w @hermes/server"
    environment:
      PORT: '8090'
      CORS_ORIGIN: http://localhost:5273
      DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermes_chat?schema=public
      JWT_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      HERMES_GATEWAYS: '[{"id":"default","model":"hermes-agent","baseURL":"http://hermes-agent:8642","apiKey":"${HERMES_API_KEY}"}]'
      HERMES_DEFAULT_MODEL: hermes-agent
      # Reliable file watching on bind mounts (macOS/Windows Docker).
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '8090:8090'
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/server/node_modules
      - /app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      hermes-agent:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: hermes-chat-dev:local
    build:
      context: .
      target: dev
    command: npm run dev -w @hermes/client
    environment:
      BFF_PROXY_TARGET: http://server:8090
      VITE_USE_POLLING: 'true'
    ports:
      - '5273:5273'
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/client/node_modules
      - /app/vendor
    depends_on:
      - server
    restart: unless-stopped

volumes:
  hermes-pgdata:
  hermes-agent-data:
